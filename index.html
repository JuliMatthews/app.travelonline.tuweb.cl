<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Travelonline — Panel</title>
    <script>
      // Evita el "flash" de tema incorrecto al cargar — se aplica antes de
      // que React monte, con la misma lógica que src/lib/theme.ts.
      (function () {
        var stored = localStorage.getItem("to_admin_theme");
        var isDark = stored ? stored === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
        if (isDark) document.documentElement.classList.add("dark");
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
